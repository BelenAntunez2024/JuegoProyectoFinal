services:
  # --- SERVICIO 1: BASE DE DATOS (POSTGRESQL) ---
  db:
    image: postgres:16
    container_name: juego_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tu_contraseña_segura
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"

  # --- SERVICIO 2: APLICACIÓN WEB (DJANGO) ---
  web:
    build: .
    container_name: juego_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=tu_contraseña_segura
      - DB_PORT=5432
      # Credenciales para la creación automática del Superusuario / Moderador
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@ejemplo.com
      - DJANGO_SUPERUSER_PASSWORD=adminpassword123
    # Comando de inicialización automática en cadena:
    # 1. Aplica migraciones
    # 2. Carga el fixture de cartas de famosos
    # 3. Inicializa los grupos Jugador y Moderador
    # 4. Crea el superusuario si no existe (sin pedir datos por consola)
    # 5. Inicia el servidor
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata famosos.json || true &&
             python manage.py crear_grupos || true &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

volumes:
  postgres_data: