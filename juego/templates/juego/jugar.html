<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>¿Qué edad tiene?</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 400px;">
            {% if famoso %}
                <img src="{{ famoso.imagen_url }}" class="card-img-top" alt="{{ famoso.nombre }}">
                <div class="card-body text-center">
                    <h2 class="card-title">{{ famoso.nombre }}</h2>
                    <p class="text-muted">{{ famoso.profesion }}</p>
                    
                    <form method="POST" class="mt-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="number" name="edad_estimada" class="form-control" placeholder="¿Qué edad tiene?" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Adivinar</button>
                    </form>
                </div>
                {% if resultado %}
                    <div class="alert alert-info mt-3">{{ resultado }}</div>
                    <a href="{% url 'jugar' %}" class="btn btn-secondary w-100">Jugar otra vez</a>
                {% endif %}
            {% else %}
                <div class="card-body">
                    <p>No hay famosos cargados. ¡Carga algunos desde el <a href="/admin">Panel Admin</a>!</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
